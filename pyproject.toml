[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmismatch"
version = "0.1.0"
description = "Where rollout/trainer mismatch hurts in agentic (tool-using) RL"
requires-python = ">=3.10"
dependencies = [
    "math-verify>=0.7",
    "numpy",
    "pandas",
    "pyarrow",
    "datasets",
    "transformers",
]

[project.optional-dependencies]
# Installed on PACE GPU nodes only. Pin exact versions in requirements.lock after the first working install.
gpu = ["vllm", "torch"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
